<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Prépa physique">
<meta name="theme-color" content="#070B14">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<title>Prépa physique 🏋️‍♂️</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600;700&display=swap">
<style>
/* Layout : une colonne mobile (max 640px), barre d'onglets fixe en bas, éditeur de séance en feuille plein écran.
   Thème : sombre unique, repris de l'icône « anneau » (nuit bleutée, dégradé vert d'eau → bleu ciel). */
:root {
  --bg: #070B14;
  --surface: #101828;
  --surface-2: #19243A;
  --ink: #E8EEF8;
  --muted: #8B98B3;
  --line: #222E48;
  --accent: #38BDF8;
  --accent-2: #22D3A6;
  --grad: linear-gradient(135deg, #22D3A6 0%, #38BDF8 100%);
  --accent-ink: #061018;
  --accent-soft: rgba(56,189,248,.14);
  --good: #4ADE80;
  --good-soft: rgba(74,222,128,.14);
  --warn: #FBBF24;
  --warn-soft: rgba(251,191,36,.14);
  --bad: #F87171;
  --bad-soft: rgba(248,113,113,.14);
  --shadow: 0 1px 0 rgba(255,255,255,.03) inset, 0 6px 18px rgba(0,0,0,.35);
  --f-display: "Barlow Condensed", "Arial Narrow", "Helvetica Neue", sans-serif;
  --f-body: "Barlow", -apple-system, "Helvetica Neue", Arial, sans-serif;
  --r: 14px;
  color-scheme: dark;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { background: var(--bg); color: var(--ink); margin: 0; }
[hidden] { display: none !important; }
img { max-width: 100%; }
body { padding-top: env(safe-area-inset-top, 0px); font-family: var(--f-body); font-size: 16px; line-height: 1.4; -webkit-text-size-adjust: 100%; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.num { font-variant-numeric: tabular-nums; }

.wrap { max-width: 640px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
header.top { padding-block: 14px 6px; display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; }
.brand { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.eyebrow { font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
h1, h2, h3 { font-family: var(--f-display); font-weight: 700; margin: 0; text-wrap: balance; letter-spacing: .01em; }
h1 { font-size: 30px; line-height: 1.05; }
h2 { font-size: 22px; }
h3 { font-size: 18px; }
.sync { font-size: 12px; font-weight: 600; padding: 4px 9px; border-radius: 99px; white-space: nowrap; background: var(--surface-2); color: var(--muted); }
.sync.ok { background: var(--good-soft); color: var(--good); }
.sync.local { background: var(--warn-soft); color: var(--warn); }

main { padding-block: 8px calc(96px + env(safe-area-inset-bottom, 0px)); display: flex; flex-direction: column; gap: 18px; }
section { display: flex; flex-direction: column; gap: 10px; }
.sec-head { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; }
.card { background: var(--surface); border-radius: var(--r); box-shadow: var(--shadow); padding: 14px; display: flex; flex-direction: column; gap: 10px; }
.muted { color: var(--muted); }
.small { font-size: 13px; }
.row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.grow { flex: 1; min-width: 0; }

/* Bandeau couloirs */
.lanes { position: relative; overflow: hidden; border-radius: var(--r); background: var(--grad); color: var(--accent-ink); padding: 16px; display: flex; flex-direction: column; gap: 12px; }
.lanes::after { content: ""; position: absolute; width: 220px; height: 220px; right: -70px; top: -70px; pointer-events: none; opacity: .18;
  border-radius: 50%; border: 26px solid currentColor; }
.lanes > * { position: relative; z-index: 1; }
.lanes .eyebrow { color: inherit; opacity: .8; }
.ready { display: flex; align-items: center; gap: 14px; }
.ready .big { font-family: var(--f-display); font-size: 52px; line-height: .9; font-weight: 700; }

/* Boutons */
.btn { border: 0; border-radius: 12px; padding: 12px 16px; font-weight: 600; background: var(--surface-2); color: var(--ink); min-height: 44px; display: inline-flex; align-items: center; justify-content: center; gap: 6px; }
.btn.primary { background: var(--grad); color: var(--accent-ink); }
.btn.ghost { background: transparent; color: var(--accent); padding-inline: 8px; }
.btn.danger { background: var(--bad-soft); color: var(--bad); }
.btn.on-accent { background: var(--accent-ink); color: var(--accent); }
.btn.block { width: 100%; }
.btn.sm { min-height: 36px; padding: 6px 12px; font-size: 14px; border-radius: 10px; }
.btn:disabled { opacity: .45; }

/* Stats */
.stats { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.stat { background: var(--surface); border-radius: var(--r); box-shadow: var(--shadow); padding: 12px; display: flex; flex-direction: column; gap: 2px; }
.stat .v { font-family: var(--f-display); font-size: 28px; font-weight: 700; line-height: 1.05; font-variant-numeric: tabular-nums; }
.stat .v small { font-size: 15px; font-weight: 600; color: var(--muted); margin-left: 2px; }
.pill { display: inline-flex; align-items: center; gap: 4px; font-size: 12px; font-weight: 700; padding: 3px 8px; border-radius: 99px; letter-spacing: .02em; }
.pill.good { background: var(--good-soft); color: var(--good); }
.pill.warn { background: var(--warn-soft); color: var(--warn); }
.pill.bad { background: var(--bad-soft); color: var(--bad); }
.pill.info { background: var(--accent-soft); color: var(--accent); }
.pill.neutral { background: var(--surface-2); color: var(--muted); }

/* Liste de séances */
.sess { display: flex; align-items: center; gap: 12px; background: var(--surface); border: 0; border-radius: var(--r); box-shadow: var(--shadow); padding: 12px 14px; text-align: left; width: 100%; }
.sess .stripe { width: 4px; align-self: stretch; border-radius: 4px; background: var(--line); flex: none; }
.sess.faite .stripe { background: var(--good); }
.sess.prevue .stripe { background: var(--accent); }
.sess .t { font-weight: 600; }
.sess .chev { color: var(--muted); font-size: 20px; }
.empty { border: 1.5px dashed var(--line); border-radius: var(--r); padding: 16px; color: var(--muted); display: flex; flex-direction: column; gap: 10px; }

/* Planning */
.weeknav { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.weeknav .btn { width: 44px; padding: 0; font-size: 20px; }
.day { background: var(--surface); border-radius: var(--r); box-shadow: var(--shadow); padding: 10px 12px; display: flex; flex-direction: column; gap: 8px; }
.day.today { outline: 2px solid var(--accent); outline-offset: -2px; }
.day-h { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.day-h .d { font-family: var(--f-display); font-size: 18px; font-weight: 700; text-transform: capitalize; }
.chip-s { border: 0; display: flex; align-items: center; gap: 8px; text-align: left; padding: 8px 10px; border-radius: 10px; background: var(--surface-2); width: 100%; }
.chip-s.faite { background: var(--good-soft); }
.chip-s.prevue { background: var(--accent-soft); }
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); flex: none; }
.faite .dot { background: var(--good); }
.prevue .dot { background: var(--accent); }

/* Tabs */
nav.tabs { position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; background: var(--surface); border-top: 1px solid var(--line);
  padding: 6px max(8px, env(safe-area-inset-right, 0px)) calc(6px + env(safe-area-inset-bottom, 0px)) max(8px, env(safe-area-inset-left, 0px)); }
nav.tabs .in { max-width: 640px; margin: 0 auto; display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; }
nav.tabs button { border: 0; background: transparent; display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 6px 0; font-size: 12px; font-weight: 600; color: var(--muted); border-radius: 10px; min-height: 48px; }
nav.tabs button svg { width: 24px; height: 24px; }
nav.tabs button[aria-current="page"] { color: var(--accent); background: var(--accent-soft); }

/* Feuille plein écran */
#sheet { position: fixed; inset: 0; z-index: 40; background: var(--bg); overflow-y: auto; -webkit-overflow-scrolling: touch; overscroll-behavior: contain; }
.sheet-h { position: sticky; top: 0; z-index: 2; background: var(--bg); border-bottom: 1px solid var(--line); padding-top: calc(env(safe-area-inset-top, 0px) + 8px); padding-bottom: 8px; }
.sheet-h .in { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.sheet-b { padding-block: 14px calc(110px + env(safe-area-inset-bottom, 0px)); display: flex; flex-direction: column; gap: 14px; }
.sheet-f { position: fixed; left: 0; right: 0; bottom: 0; z-index: 3; background: var(--surface); border-top: 1px solid var(--line); padding-top: 10px; padding-bottom: calc(10px + env(safe-area-inset-bottom, 0px)); }
.sheet-f .in { display: flex; gap: 10px; }
.sheet-f .btn { flex: 1; }
.saved { font-size: 13px; color: var(--muted); }

label.f { display: flex; flex-direction: column; gap: 4px; font-size: 13px; font-weight: 600; color: var(--muted); }
.inp { width: 100%; border: 1.5px solid var(--line); background: var(--surface); border-radius: 10px; padding: 10px 12px; font-size: 16px; color: var(--ink); min-height: 44px; }
.inp:focus { border-color: var(--accent); outline: none; }
textarea.inp { min-height: 70px; resize: vertical; }
.grid2 { display: grid; grid-template-columns: minmax(0, 1.4fr) minmax(0, 1fr); gap: 10px; }

.seg { display: flex; flex-wrap: wrap; gap: 6px; }
.seg button { border: 1.5px solid var(--line); background: var(--surface); border-radius: 10px; min-height: 40px; min-width: 40px; padding: 6px 10px; font-weight: 600; font-variant-numeric: tabular-nums; }
.seg button[aria-pressed="true"] { background: var(--grad); border-color: var(--accent); color: var(--accent-ink); }

/* Exercice */
.exo { background: var(--surface); border-radius: var(--r); box-shadow: var(--shadow); padding: 12px; display: flex; flex-direction: column; gap: 10px; }
.exo-h { display: flex; gap: 8px; align-items: center; }
.exo-h .inp { font-weight: 600; }
.icon-btn { border: 0; background: var(--surface-2); width: 40px; height: 40px; border-radius: 10px; flex: none; display: inline-flex; align-items: center; justify-content: center; color: var(--muted); font-size: 18px; }
.icon-btn.confirm { background: var(--bad); color: var(--accent-ink); width: auto; padding: 0 10px; font-size: 13px; font-weight: 700; }
.hint { font-size: 13px; color: var(--muted); }
.hint b { color: var(--ink); font-weight: 600; }
.sets { display: flex; flex-direction: column; gap: 6px; }
.set-h, .set { display: grid; grid-template-columns: 22px minmax(0, 1fr) minmax(0, 1.15fr) 44px; gap: 8px; align-items: center; }
.set-h { font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); font-weight: 700; }
.set .n { font-family: var(--f-display); font-weight: 700; color: var(--muted); text-align: center; font-size: 17px; }
.stepper { display: grid; grid-template-columns: 34px minmax(0, 1fr) 34px; align-items: center; background: var(--surface-2); border-radius: 10px; height: 44px; }
.stepper button { border: 0; background: transparent; height: 44px; font-size: 20px; font-weight: 600; color: var(--accent); }
.stepper input { border: 0; background: transparent; text-align: center; width: 100%; min-width: 0; font-size: 17px; font-weight: 700; font-variant-numeric: tabular-nums; padding: 0; height: 44px; }
.stepper input:focus { outline: none; }
.okbtn { width: 44px; height: 44px; border-radius: 12px; border: 2px solid var(--line); background: var(--surface); display: inline-flex; align-items: center; justify-content: center; color: transparent; }
.okbtn[aria-pressed="true"] { background: var(--good); border-color: var(--good); color: var(--accent-ink); }
.set.done .stepper { background: var(--good-soft); }
.exo-f { display: flex; gap: 8px; flex-wrap: wrap; }

.exo.done { box-shadow: inset 0 0 0 2px var(--good), var(--shadow); }
.iso { display: flex; flex-direction: column; gap: 10px; }
.iso-top { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }
.iso-t { font-family: var(--f-display); font-size: 42px; font-weight: 700; line-height: 1; }
.pbar { height: 8px; border-radius: 99px; background: var(--surface-2); overflow: hidden; }
.pbar > span { display: block; height: 100%; background: var(--grad); border-radius: 99px; }
.iso .row .btn { min-height: 48px; }
.tag { font-size: 11px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--accent-2); }
.plist { display: flex; flex-direction: column; gap: 8px; }
.prow { border: 0; text-align: left; width: 100%; background: var(--surface); border-radius: var(--r); box-shadow: var(--shadow); padding: 14px; display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px 12px; align-items: center; }
.prow .pn { font-weight: 600; font-size: 17px; }
.prow .pt { font-family: var(--f-display); font-size: 22px; font-weight: 700; font-variant-numeric: tabular-nums; }
.prow .pt small { font-size: 14px; color: var(--muted); font-weight: 600; }
.prow .pbar { grid-column: 1 / -1; }
.prow.ok { box-shadow: inset 0 0 0 2px var(--good), var(--shadow); }
.prow.ok .pn::after { content: " ✓"; color: var(--good); }
.prow.run .pt { color: var(--accent); }
.focus { padding-block: 20px calc(40px + env(safe-area-inset-bottom, 0px)); display: flex; flex-direction: column; align-items: center; gap: 22px; text-align: center; }
.focus h1 { font-size: 36px; }
.ring { position: relative; width: min(78vw, 300px); aspect-ratio: 1; max-width: 100%; }
.ring svg { width: 100%; height: 100%; transform: rotate(-90deg); }
.ring .rbg { fill: none; stroke: var(--surface-2); stroke-width: 16; }
.ring .rfg { fill: none; stroke: url(#rgrad); stroke-width: 16; stroke-linecap: round; }
.ring .rc { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; }
.ring .big-t { font-family: var(--f-display); font-size: clamp(56px, 18vw, 84px); font-weight: 700; line-height: 1; font-variant-numeric: tabular-nums; }
.btn.huge { width: 100%; max-width: 420px; min-height: 66px; font-size: 21px; border-radius: 18px; }
.seg.mini { flex-wrap: nowrap; gap: 4px; min-width: 0; }
.seg.mini button { min-width: 0; min-height: 36px; padding: 4px 0; font-size: 14px; flex: 1 1 0; border-radius: 8px; }
.tpl-list { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 4px; }
.tpl-list .btn { flex: none; }

/* Timer de repos */
#timer { position: fixed; z-index: 60; right: max(16px, env(safe-area-inset-right, 0px)); left: max(16px, env(safe-area-inset-left, 0px)); bottom: calc(84px + env(safe-area-inset-bottom, 0px));
  max-width: 420px; margin: 0 auto; background: var(--ink); color: var(--bg); border-radius: 16px; padding: 10px 12px; display: flex; align-items: center; gap: 10px; box-shadow: 0 8px 24px rgba(0,0,0,.25); }
#timer .tt { font-family: var(--f-display); font-size: 30px; font-weight: 700; font-variant-numeric: tabular-nums; min-width: 72px; }
#timer .lbl { font-size: 12px; opacity: .75; text-transform: uppercase; letter-spacing: .08em; font-weight: 700; }
#timer button { border: 0; border-radius: 10px; background: rgba(127,127,127,.25); color: inherit; height: 38px; padding: 0 10px; font-weight: 700; }
#timer.end { background: var(--grad); color: var(--accent-ink); }

#toast { position: fixed; z-index: 70; left: 50%; transform: translateX(-50%); top: calc(env(safe-area-inset-top, 0px) + 12px); background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 12px; font-weight: 600; font-size: 14px; max-width: calc(100% - 32px); box-shadow: 0 8px 24px rgba(0,0,0,.25); }

/* Graphiques */
.chart svg { width: 100%; height: auto; display: block; }
.chart .ax { fill: var(--muted); font-size: 10px; font-family: var(--f-body); }
.chart .grid { stroke: var(--line); stroke-width: 1; }
.chart .ln { fill: none; stroke: var(--accent); stroke-width: 2.25; stroke-linejoin: round; stroke-linecap: round; }
.chart .ar { fill: var(--accent); opacity: .12; }
.chart .pt { fill: var(--accent); }
.chart .end { fill: var(--surface); stroke: var(--accent); stroke-width: 2.5; }
.chart .endl { fill: var(--ink); font-size: 12px; font-weight: 700; font-family: var(--f-body); }
.chart .bar { fill: var(--accent-2); }
.chart .bar.cur { fill: var(--accent); }
.chart .bv { fill: var(--ink); font-size: 10px; font-weight: 600; font-family: var(--f-body); }
.empty-chart { margin: 0; padding: 18px 4px; color: var(--muted); font-size: 14px; text-align: center; }
.rec { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.rec .stat .v { font-size: 22px; }

.list { display: flex; flex-direction: column; gap: 8px; }
.kv { display: flex; justify-content: space-between; gap: 10px; padding: 8px 0; border-bottom: 1px solid var(--line); }
.kv:last-child { border-bottom: 0; }
.legend { display: flex; gap: 12px; flex-wrap: wrap; font-size: 12px; color: var(--muted); }
@media (prefers-reduced-motion: no-preference) { .card, .sess, .day { transition: transform .12s ease; } .sess:active, .chip-s:active { transform: scale(.985); } }
.backup-warn { background: var(--warn-soft); border-radius: var(--r); padding: 12px 14px; display: flex; align-items: center; gap: 10px; }
.backup-warn .grow { color: var(--ink); font-size: 14px; }
</style>
</head>
<body>

<div class="wrap">
  <header class="top">
    <div class="brand">
      <span class="eyebrow" id="hdr-date">Carnet de préparation physique</span>
      <h1 id="hdr-title">Prépa physique 🏋️‍♂️</h1>
    </div>
    <span class="sync" id="sync">Connexion…</span>
  </header>
  <main id="view"></main>
</div>

<nav class="tabs" aria-label="Sections">
  <div class="in">
    <button data-tab="today" aria-current="page"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="8"/><path d="M12 8v4l3 2"/></svg>Aujourd'hui</button>
    <button data-tab="plan"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="5" width="16" height="15" rx="2"/><path d="M4 10h16M9 3v4M15 3v4"/></svg>Planning</button>
    <button data-tab="prog"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19h16"/><path d="M5 15l4-4 3 3 6-7"/></svg>Progrès</button>
    <button data-tab="data"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="12" cy="6" rx="7" ry="3"/><path d="M5 6v6c0 1.7 3.1 3 7 3s7-1.3 7-3V6M5 12v6c0 1.7 3.1 3 7 3s7-1.3 7-3v-6"/></svg>Données</button>
  </div>
</nav>

<div id="sheet" hidden></div>
<div id="timer" hidden></div>
<div id="toast" hidden></div>

<script>
/* ---------- Référentiel ---------- */
const TYPES = ['Force', 'Puissance', 'Pliométrie', 'Hypertrophie', 'Haltérophilie', 'Prévention', 'Mixte'];
const EXOS = [
  'Squat', 'Demi-squat', 'Squat avant', 'Soulevé de terre', 'Soulevé de terre roumain', 'Fentes', 'Fentes bulgares', 'Step-up', 'Hip thrust', 'Leg curl', 'Ischios nordiques', 'Mollets debout',
  'Épaulé (power clean)', 'Épaulé suspendu', 'Arraché (power snatch)', 'Arraché suspendu', 'Jeté', 'Tirage d\'épaulé',
  'Développé couché', 'Développé incliné', 'Développé militaire', 'Push press', 'Tractions', 'Rowing barre', 'Dips', 'Pull-over',
  'Squat jump', 'CMJ', 'Box jump', 'Sauts de haies', 'Bondissements', 'Foulées bondissantes', 'Drop jump', 'Lancer médecine-ball avant', 'Lancer médecine-ball arrière', 'Lancer médecine-ball rotatif',
  'Gainage ventral', 'Gainage latéral', 'Copenhague', 'Rotations au câble', 'Pallof press', 'Relevés de jambes'
];
const FORME_ITEMS = [
  { k: 'qs', label: 'Qualité du sommeil', lo: 'Mauvaise', hi: 'Excellente' },
  { k: 'fat', label: 'Fatigue', lo: 'Frais', hi: 'Épuisé' },
  { k: 'cour', label: 'Courbatures', lo: 'Aucune', hi: 'Fortes' },
  { k: 'mot', label: 'Motivation', lo: 'Faible', hi: 'Au top' },
];

/* ---------- Séances types intégrées ---------- */
// Exercice au temps : objectif en secondes, temps cumulé sur plusieurs reprises
const isoEx = (nom, min) => ({ nom, mode: 'temps', cible: min * 60, fait: 0, ok: false, series: [], note: '' });
const MODELES_INTEGRES = {

const iso = d => { const x = new Date(d); return x.getFullYear() + '-' + String(x.getMonth() + 1).padStart(2, '0') + '-' + String(x.getDate()).padStart(2, '0'); };
const parseD = s => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); };
const addDays = (s, n) => { const d = parseD(s); d.setDate(d.getDate() + n); return iso(d); };

const resetExos = exos => (exos || []).forEach(x => { delete x.rpe; (x.series || []).forEach(st => st.ok = false); if (x.mode === 'temps') { x.fait = 0; x.ok = false; } });
const e1rm = (r, k) => (r > 0 && k > 0) ? (r === 1 ? k : k * (1 + r / 30)) : 0;

/* ---------- Stockage : base de l'artefact + copie locale de secours ---------- */
const COLS = ['seances', 'forme', 'modeles', 'oura'];
const data = { seances: new Map(), forme: new Map(), modeles: new Map(), oura: new Map() };
let db = null, mode = 'loading';
const LS = 'carnet-decathlon-v1';
function cacheLoad() { try { const o = JSON.parse(localStorage.getItem(LS) || '{}'); COLS.forEach(c => data[c] = new Map(Object.entries(o[c] || {}))); } catch (e) {} }
function cacheSave() { try { const o = {}; COLS.forEach(c => o[c] = Object.fromEntries(data[c])); localStorage.setItem(LS, JSON.stringify(o)); } catch (e) { toast('Enregistrement impossible : fais une sauvegarde dans l\'onglet Données.'); } }

const chains = {};
function persist(col, id, obj) {
  data[col].set(id, obj); cacheSave();
  if (!db) return Promise.resolve();
  const key = col + '/' + id;
  chains[key] = (chains[key] || Promise.resolve()).then(() => db.collection(col).doc(id).set(obj)).catch(err => {
    toast(err && err.code === 'quota_exceeded' ? 'Stockage plein : exporte puis supprime d\'anciennes données.' : 'Échec de la sauvegarde en ligne (gardée sur l\'appareil).');
  });
  return chains[key];
}
function removeDoc(col, id) {
  data[col].delete(id); cacheSave();
  if (!db) return Promise.resolve();
  const key = col + '/' + id;
  chains[key] = (chains[key] || Promise.resolve()).then(() => db.collection(col).doc(id).delete()).catch(() => toast('Échec de la suppression en ligne.'));
  return chains[key];
}

async function connect() {

/* ---------- Calculs ---------- */
const seancesList = () => [...data.seances.entries()].map(([id, s]) => ({ id, ...s }));
const setCounts = (s, st) => st.ok || s.statut === 'faite';
function tonnage(s) { let t = 0; (s.exos || []).forEach(e => (e.series || []).forEach(st => { if (setCounts(s, st)) t += (+st.r || 0) * (+st.k || 0); })); return t; }
const srpe = s => (s.statut === 'faite' && s.rpe && s.duree) ? s.rpe * s.duree : 0;
function readiness(f, o) {
  const subj = f ? ((5 - f.fat) + (5 - f.cour) + (f.mot - 1)) / 12 * 100 : null;
  if (o && o.readiness != null) return subj == null ? o.readiness : Math.round(0.5 * o.readiness + 0.5 * subj);
  if (!f) return null; const v = ((f.qs - 1) + (5 - f.fat) + (5 - f.cour) + (f.mot - 1)) / 16; return Math.round(v * 100);
}
const formeDay = d => readiness(data.forme.get(d), data.oura.get(d));
const fmtH = h => Math.floor(h) + ' h ' + String(Math.round((h % 1) * 60)).padStart(2, '0');
function hrvBase(d) {
  const v = []; for (let i = 1; i <= 30; i++) { const o = data.oura.get(addDays(d, -i)); if (o && o.hrv) v.push(o.hrv); }
  return v.length >= 3 ? Math.round(v.reduce((a, b) => a + b, 0) / v.length) : null;
}
function readyState(r) { return r >= 70 ? ['good', 'Prêt'] : r >= 45 ? ['warn', 'Moyen'] : ['bad', 'À ménager']; }
function loadBetween(a, b) { return seancesList().filter(s => s.date >= a && s.date <= b).reduce((t, s) => t + srpe(s), 0); }
function acwr() {
  const t = todayS(); const acute = loadBetween(addDays(t, -6), t); const chronic = loadBetween(addDays(t, -27), t) / 4;
  const hasHistory = seancesList().some(s => srpe(s) && s.date <= addDays(t, -21));
  if (!chronic || !hasHistory) return null; return acute / chronic;
}
function lastPerf(name, beforeDate, excludeId) {
  const n = name.trim().toLowerCase(); if (!n) return null;
  const list = seancesList().filter(s => s.id !== excludeId && s.date <= beforeDate).sort((a, b) => b.date.localeCompare(a.date));
  for (const s of list) { const e = (s.exos || []).find(x => (x.nom || '').trim().toLowerCase() === n); if (e && ((e.series && e.series.length) || (e.mode === 'temps' && e.fait))) return { s, e }; }
  return null;
}
function summarize(e) { const t = summarize0(e); return e.rpe && e.mode !== 'temps' ? t + ' · RPE ' + e.rpe : t; }
function summarize0(e) {
  if (e.mode === 'temps') return mmss(e.fait || 0) + ' sur ' + mmss(e.cible || 0);
  const ser = e.series || []; if (!ser.length) return '';
  const same = ser.every(x => x.r === ser[0].r && x.k === ser[0].k);
  if (same) return ser.length + '×' + ser[0].r + (ser[0].k ? ' · ' + nf(ser[0].k) + ' kg' : '');
  return ser.map(x => x.r + (x.k ? '@' + nf(x.k) : '')).join(' / ') + (ser.some(x => x.k) ? ' kg' : '');
}

/* ---------- Oura Ring (via le relais Cloudflare) ---------- */
const RELAIS = 'https://prepa-physique-oura.ludovic-rivoira.workers.dev';
let ouraBusy = false;
const ouraAuth = () => pref('ouraAuth', null);
function ouraFromHash() {
  const h = new URLSearchParams(location.hash.slice(1));
  if (h.get('oura_access')) {
    setPref('ouraAuth', { access: h.get('oura_access'), refresh: h.get('oura_refresh'), exp: Date.now() + (+h.get('oura_expires') || 86400) * 1000 });
    history.replaceState(null, '', location.pathname); toast('Oura connectée ✓'); return;
  }
  if (h.get('oura_error')) { history.replaceState(null, '', location.pathname); toast('Connexion Oura annulée ou refusée.'); }
}
async function ouraToken() {
  let a = ouraAuth(); if (!a) return null;
  if (Date.now() < a.exp - 120000) return a.access;
  const r = await fetch(RELAIS + '/refresh', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ refresh_token: a.refresh }) });
  if (!r.ok) { if (r.status === 401) { setPref('ouraAuth', null); render(); toast('Reconnecte Oura dans l\'onglet Données.'); } return null; }
  const j = await r.json();
  a = { access: j.access_token, refresh: j.refresh_token || a.refresh, exp: Date.now() + (j.expires_in || 86400) * 1000 }; setPref('ouraAuth', a);
  return a.access;
}
async function ouraGet(what, start, end, tok) {
  const r = await fetch(`${RELAIS}/api/${what}?start_date=${start}&end_date=${end}`, { headers: { Authorization: 'Bearer ' + tok } });
  if (!r.ok) throw new Error(what + ' ' + r.status);
  return (await r.json()).data || [];
}
async function syncOura(force) {
  if (ouraBusy || !ouraAuth()) return;
  if (!force && Date.now() - pref('ouraSync', 0) < 15 * 60000) return;
  ouraBusy = true;
  try {
    const tok = await ouraToken(); if (!tok) return;
    const start = addDays(todayS(), -30), end = addDays(todayS(), 1);
    const [sleeps, ready, dsleep] = await Promise.all([ouraGet('sleep', start, end, tok), ouraGet('daily_readiness', start, end, tok), ouraGet('daily_sleep', start, end, tok)]);
    const days = {}; const get = d => days[d] || (days[d] = {});
    // Nuit principale = la plus longue période de sommeil attribuée au jour (le jour du réveil)
    sleeps.forEach(x => {
      if (x.type !== 'long_sleep' && x.type !== 'sleep') return;
      const o = get(x.day); const dur = x.total_sleep_duration || 0; if (o._dur != null && o._dur >= dur) return;
      o._dur = dur; o.sommeil = dur ? dur / 3600 : null; o.hrv = x.average_hrv != null ? Math.round(x.average_hrv) : null; o.fc = x.lowest_heart_rate || null; o.efficacite = x.efficiency || null;
    });
    ready.forEach(x => { const o = get(x.day); o.readiness = x.score; if (x.temperature_deviation != null) o.temp = Math.round(x.temperature_deviation * 10) / 10; });
    dsleep.forEach(x => { get(x.day).scoreSommeil = x.score; });
    Object.entries(days).forEach(([d, o]) => { delete o._dur; data.oura.set(d, o); });
    cacheSave(); setPref('ouraSync', Date.now()); render();
    if (force) toast('Données Oura à jour ✓');
  } catch (e) { if (force) toast('Oura injoignable pour le moment.'); }
  finally { ouraBusy = false; }
}

/* ---------- Vue Progrès ---------- */
function viewProg() {
  const all = seancesList().filter(s => s.statut === 'faite').sort((a, b) => a.date.localeCompare(b.date));
  const names = {};
  all.forEach(s => (s.exos || []).forEach(e => { if (e.mode === 'temps') return; const n = (e.nom || '').trim(); if (n) names[n] = (names[n] || 0) + 1; }));
  const list = Object.keys(names).sort((a, b) => names[b] - names[a]);
  if (!list.includes(progExo)) progExo = list[0] || '';
  let exoBlock = '<div class="empty">Termine une séance de musculation pour voir ta progression par exercice.</div>';
  if (progExo) {
    const pts = []; let bestK = 0, bestE = 0, bestKd = '', bestEd = '';
    all.forEach(s => (s.exos || []).filter(e => (e.nom || '').trim() === progExo).forEach(e => {
      let m = 0; (e.series || []).forEach(st => { const v = e1rm(+st.r, +st.k); if (v > m) m = v; if (+st.k > bestK) { bestK = +st.k; bestKd = s.date; } });
      if (m > 0) { pts.push({ t: parseD(s.date).getTime(), y: m, d: s.date }); if (m > bestE) { bestE = m; bestEd = s.date; } }
    }));
    exoBlock = `<div class="card">
      <select class="inp" id="prog-exo" aria-label="Exercice">${list.map(n => `<option ${n === progExo ? 'selected' : ''}>${esc(n)}</option>`).join('')}</select>
      <div class="rec">
        <div class="stat"><span class="eyebrow">1RM estimé</span><span class="v">${bestE ? nf(bestE, 1) : '–'}<small>kg</small></span><span class="small muted">${bestEd ? fShort(bestEd) : ''}</span></div>
        <div class="stat"><span class="eyebrow">Charge max</span><span class="v">${bestK ? nf(bestK, 1) : '–'}<small>kg</small></span><span class="small muted">${bestKd ? fShort(bestKd) : ''}</span></div>
        <div class="stat"><span class="eyebrow">Séances</span><span class="v">${names[progExo]}</span><span class="small muted">au total</span></div>
      </div>
      <div class="chart">${lineChart(pts, 'kg')}</div>
      <span class="small muted">1RM estimé par la formule d'Epley : charge × (1 + reps / 30), meilleure série de chaque séance.</span>
    </div>`;
  }

  // charge hebdo, 8 semaines
  const wk0 = monday(todayS()); const bars = [];
  for (let i = 7; i >= 0; i--) { const a = addDays(wk0, -7 * i); bars.push({ label: fShort(a), v: loadBetween(a, addDays(a, 6)), cur: i === 0 }); }
  // forme 30 j
  const fpts = [], ppts = [], hpts = [];
  for (let i = 29; i >= 0; i--) { const d = addDays(todayS(), -i); const f = data.forme.get(d); const o = data.oura.get(d); const tt = parseD(d).getTime(); const fr = readiness(f, o); if (fr != null) fpts.push({ t: tt, y: fr, d }); if (f && f.poids) ppts.push({ t: tt, y: +f.poids, d }); if (o && o.hrv) hpts.push({ t: tt, y: o.hrv, d }); }

  return `
  ${viewEvpa()}
  <section><h2>Par exercice</h2>${exoBlock}</section>
  <section><div class="sec-head"><h2>Indice de forme</h2><span class="small muted">30 derniers jours</span></div>
    <div class="card"><div class="chart">${lineChart(fpts, '', [0, 100])}</div></div></section>
  ${hpts.length ? `<section><div class="sec-head"><h2>HRV nocturne</h2><span class="small muted">30 derniers jours · Oura</span></div><div class="card"><div class="chart">${lineChart(hpts, 'ms')}</div><span class="small muted">Une HRV nettement sous ta moyenne signale souvent une fatigue à surveiller : allège la séance ce jour-là.</span></div></section>` : ''}
  ${ppts.length ? `<section><div class="sec-head"><h2>Poids de corps</h2><span class="small muted">30 derniers jours</span></div><div class="card"><div class="chart">${lineChart(ppts, 'kg')}</div></div></section>` : ''}
  <section><h2>Historique</h2>
    ${all.length ? all.slice(-15).reverse().map(s => sessBtn(s, fShort(s.date) + ' · ' + (tonnage(s) ? nf(tonnage(s), 0) + ' kg · ' : ''))).join('') : '<div class="empty">Tes séances terminées apparaîtront ici.</div>'}
  </section>`;
}

function viewEvpa() {
  const recs = [];
  seancesList().forEach(x => (x.exos || []).forEach(e => { if (e.mode === 'temps' && e.fait > 0) recs.push({ date: x.date, nom: (e.nom || '').trim(), sec: e.fait }); }));
  if (!recs.length) return `<section><h2>EVPA</h2><div class="empty">Le temps passé sur chaque exercice EVPA s'affichera ici, par jour, par semaine et par mois.</div></section>`;
  const ordre = MODELES_INTEGRES['int-evpa'].exos.map(e => e.nom);
  const noms = [...new Set([...ordre.filter(n => recs.some(r => r.nom === n)), ...recs.map(r => r.nom)])];
  const per = pref('evpaPer', 'semaine'); let sel = pref('evpaExo', ''); if (sel && !noms.includes(sel)) sel = '';
  const f = recs.filter(r => !sel || r.nom === sel);
  const sum = (a, b, list = f) => list.filter(r => r.date >= a && r.date <= b).reduce((x, r) => x + r.sec, 0);
  const t = todayS(); const wk = monday(t); const d0 = parseD(t); const mStart = iso(new Date(d0.getFullYear(), d0.getMonth(), 1));
  const buckets = [];
  if (per === 'jour') for (let i = 13; i >= 0; i--) { const d = addDays(t, -i); buckets.push({ a: d, b: d, label: String(parseD(d).getDate()) }); }
  else if (per === 'semaine') for (let i = 7; i >= 0; i--) { const a = addDays(wk, -7 * i); buckets.push({ a, b: addDays(a, 6), label: fShort(a) }); }
  else for (let i = 5; i >= 0; i--) { const a = new Date(d0.getFullYear(), d0.getMonth() - i, 1), b = new Date(d0.getFullYear(), d0.getMonth() - i + 1, 0); buckets.push({ a: iso(a), b: iso(b), label: a.toLocaleDateString('fr-FR', { month: 'short' }) }); }
  const bars = buckets.map((k, i) => ({ label: k.label, v: Math.round(sum(k.a, k.b) / 60), cur: i === buckets.length - 1 }));
  const cur = buckets[buckets.length - 1];
  const parExo = noms.map(n => ({ n, sec: sum(cur.a, cur.b, recs.filter(r => r.nom === n)) })).filter(x => x.sec > 0);
  const lib = { jour: 'aujourd\'hui', semaine: 'cette semaine', mois: 'ce mois-ci' };
  return `<section><div class="sec-head"><h2>EVPA</h2><span class="small muted">temps cumulé</span></div>
    <div class="stats">
      <div class="stat"><span class="eyebrow">Aujourd'hui</span><span class="v">${Math.round(sum(t, t) / 60)}<small>min</small></span></div>
      <div class="stat"><span class="eyebrow">Cette semaine</span><span class="v">${Math.round(sum(wk, addDays(wk, 6)) / 60)}<small>min</small></span></div>
      <div class="stat"><span class="eyebrow">Ce mois-ci</span><span class="v">${Math.round(sum(mStart, t) / 60)}<small>min</small></span></div>
      <div class="stat"><span class="eyebrow">Depuis le début</span><span class="v">${Math.round(f.reduce((x, r) => x + r.sec, 0) / 60)}<small>min</small></span></div>
    </div>
    <div class="card">
      <div class="seg">${[['jour', 'Par jour'], ['semaine', 'Par semaine'], ['mois', 'Par mois']].map(([k, l]) => `<button data-evper="${k}" aria-pressed="${per === k}">${l}</button>`).join('')}</div>
      <select class="inp" id="evpa-exo" aria-label="Exercice EVPA"><option value="">Tous les exercices</option>${noms.map(n => `<option ${n === sel ? 'selected' : ''}>${esc(n)}</option>`).join('')}</select>
      <div class="chart">${bars.some(b => b.v) ? barChart(bars) : '<p class="empty-chart">Pas encore de temps sur cette période.</p>'}</div>
      <span class="small muted">En minutes${sel ? ' · ' + esc(sel) : ''}.</span>
    </div>
    ${sel ? '' : `<div class="card"><b>Par exercice, ${lib[per]}</b>${parExo.length ? parExo.map(x => `<div class="kv"><span>${esc(x.n)}</span><b class="num">${fmtDur(x.sec)}</b></div>`).join('') : '<span class="small muted">Rien pour l\'instant sur cette période.</span>'}</div>`}
  </section>`;
}
function lineChart(pts, unit, fixed) {
  if (pts.length < 2) return '<p class="empty-chart">Il faut au moins 2 relevés pour tracer une courbe.</p>';
  const W = 340, H = 160, pl = 34, pr = 40, pt = 14, pb = 22;
  let x0 = pts[0].t, x1 = pts[pts.length - 1].t; if (x1 === x0) x1 = x0 + 864e5;
  let y0, y1;
  if (fixed) { [y0, y1] = fixed; } else { y0 = Math.min(...pts.map(p => p.y)); y1 = Math.max(...pts.map(p => p.y)); const pad = (y1 - y0) * 0.2 || Math.max(1, y1 * 0.05); y0 = Math.max(0, y0 - pad); y1 += pad; }
  const X = t => pl + (t - x0) / (x1 - x0) * (W - pl - pr), Y = v => pt + (1 - (v - y0) / (y1 - y0)) * (H - pt - pb);
  let g = '';
  for (let i = 0; i <= 3; i++) { const v = y0 + (y1 - y0) * i / 3; g += `<line class="grid" x1="${pl}" x2="${W - pr}" y1="${Y(v)}" y2="${Y(v)}"/><text class="ax" x="${pl - 6}" y="${Y(v) + 3}" text-anchor="end">${nf(v, y1 - y0 < 10 ? 1 : 0)}</text>`; }
  const d = pts.map((p, i) => (i ? 'L' : 'M') + X(p.t).toFixed(1) + ',' + Y(p.y).toFixed(1)).join('');
  const area = d + `L${X(pts[pts.length - 1].t).toFixed(1)},${H - pb}L${X(pts[0].t).toFixed(1)},${H - pb}Z`;
  const last = pts[pts.length - 1];
  const dots = pts.length <= 30 ? pts.slice(0, -1).map(p => `<circle class="pt" cx="${X(p.t)}" cy="${Y(p.y)}" r="2.5"/>`).join('') : '';
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Courbe d'évolution">${g}<path class="ar" d="${area}"/><path class="ln" d="${d}"/>${dots}
    <circle class="end" cx="${X(last.t)}" cy="${Y(last.y)}" r="4.5"/><text class="endl" x="${X(last.t) + 8}" y="${Y(last.y) + 4}">${nf(last.y, 1)}${unit ? ' ' + unit : ''}</text>
    <text class="ax" x="${pl}" y="${H - 6}">${fShort(pts[0].d)}</text><text class="ax" x="${W - pr}" y="${H - 6}" text-anchor="end">${fShort(last.d)}</text></svg>`;
}
function barChart(bars) {
  const W = 340, H = 160, pl = 6, pr = 6, pt = 18, pb = 22; const max = Math.max(...bars.map(b => b.v), 1);
  const bw = (W - pl - pr) / bars.length;
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Charge par semaine"><line class="grid" x1="${pl}" x2="${W - pr}" y1="${H - pb}" y2="${H - pb}"/>` + bars.map((b, i) => {
    const h = b.v / max * (H - pt - pb); const x = pl + i * bw + bw * 0.18, w = bw * 0.64, y = H - pb - h;
    return `<rect class="bar ${b.cur ? 'cur' : ''}" x="${x}" y="${y}" width="${w}" height="${Math.max(h, b.v ? 2 : 0)}" rx="3"/>${b.v ? `<text class="bv" x="${x + w / 2}" y="${y - 4}" text-anchor="middle">${nf(b.v, 0)}</text>` : ''}<text class="ax" x="${x + w / 2}" y="${H - 6}" text-anchor="middle">${b.label.replace('.', '')}</text>`;
  }).join('') + '</svg>';
}

  const b = ev.target.closest('button'); if (!b) return;
  if (b.dataset.open) { openSession(b.dataset.open); return; }
  if (b.dataset.goto) { tab = b.dataset.goto; setPref('tab', tab); render(); window.scrollTo(0, 0); return; }
  if (b.dataset.week != null) { const n = +b.dataset.week; weekOf = n === 0 ? monday(todayS()) : addDays(weekOf, 7 * n); render(); return; }
  if (b.dataset.deltpl) { if (b.classList.contains('confirm')) { removeDoc('modeles', b.dataset.deltpl); render(); } else { b.classList.add('confirm'); b.textContent = 'Supprimer ?'; } return; }
  if (b.dataset.evper) { setPref('evpaPer', b.dataset.evper); render(); return; }
  if (b.dataset.act === 'evpa') { const ex = seancesList().find(x => x.date === todayS() && x.src === 'int-evpa'); if (ex) openSession(ex.id); else openTrig(); return; }
  if (b.dataset.rest) { setPref('rest', +b.dataset.rest); render(); toast('Repos par défaut : ' + b.textContent); return; }
  switch (b.dataset.act) {
    case 'new': openSession(null, b.dataset.date); break;
    case 'pick-tpl': openSession(null, b.dataset.date); break;
    case 'forme': openForme(todayS()); break;
    case 'backup': backup(); break;
    case 'oura-sync': syncOura(true); break;
    case 'oura-off': setPref('ouraAuth', null); render(); toast('Oura déconnectée'); break;
    case 'copy-week': {
      const src = seancesList().filter(s => s.date >= weekOf && s.date <= addDays(weekOf, 6));
      src.forEach(s => { const c = clone(s); delete c.id; c.date = addDays(s.date, 7); c.statut = 'prevue'; c.rpe = null; resetExos(c.exos); c.maj = Date.now(); persist('seances', uid(), c); });
      weekOf = addDays(weekOf, 7); render(); toast(src.length + ' séance(s) copiée(s) sur la semaine suivante'); break;
    }
  }
});
$('#view').addEventListener('change', async ev => {
  if (ev.target.id === 'evpa-exo') { setPref('evpaExo', ev.target.value); render(); }
  if (ev.target.id === 'prog-exo') { progExo = ev.target.value; setPref('exo', progExo); render(); }
  if (ev.target.id === 'imp') {
    const file = ev.target.files[0]; if (!file) return;
    try {
      const o = JSON.parse(await file.text()); let n = 0;
      for (const c of COLS) for (const [id, v] of Object.entries(o[c] || {})) { if (v && typeof v === 'object' && /^[\w\-.~:@+]+$/.test(id)) { await persist(c, id, v); n++; } }
      render(); toast(n + ' élément(s) importé(s)');
    } catch (e) { toast('Fichier illisible : choisis un export du carnet (.json).'); }
  }
});
async function backup() {
  const o = { app: 'prepa-physique', version: 1, exporte: new Date().toISOString() }; COLS.forEach(c => o[c] = Object.fromEntries(data[c]));
  const name = 'prepa-physique-' + todayS() + '.json';
  const file = new File([JSON.stringify(o, null, 1)], name, { type: 'application/json' });
  try {
    if (navigator.canShare && navigator.canShare({ files: [file] })) { await navigator.share({ files: [file], title: 'Sauvegarde Prépa physique' }); return markBackup(); }
  } catch (e) { if (e && e.name === 'AbortError') return; }
  const a = document.createElement('a'); a.href = URL.createObjectURL(file); a.download = name; document.body.appendChild(a); a.click(); a.remove();
  markBackup();
}
function markBackup() { setPref('lastBackup', Date.now()); render(); toast('Sauvegarde faite ✓'); }

/* ---------- Démarrage ---------- */
cacheLoad(); ouraFromHash(); render(); connect(); syncOura();
if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(() => {});
document.addEventListener('visibilitychange', () => { if (!document.hidden) { render(); syncOura(); } });
</script>
